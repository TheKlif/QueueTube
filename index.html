<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QueueTube</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%BA%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light dark;
  --bg:#f6f5f2;--card:#ffffff;--line:#e4e1da;--fg:#17181c;--muted:#6b6f78;--chip:#edebe6;
  --accent:#e5432f;--accent-ink:#c4341f;--accent-fill:#c4341f;--on-accent:#ffffff;
  --green:#1a9b55;--green-ink:#0f6e3b;
  --blue:#1f6fd6;--blue-ink:#1a5fc0;
  --purple:#7c4dd6;--purple-ink:#6a3bc2;
  --amber:#b97300;--amber-ink:#7d4b00;
  --warn:#7d4b00;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e0f13;--card:#16181d;--line:#2a2e36;--fg:#eceef2;--muted:#9aa1ad;--chip:#1f2229;
    --accent:#ff6b57;--accent-ink:#ff6b57;--accent-fill:#ff6b57;--on-accent:#0e0f13;
    --green:#2fbf71;--green-ink:#2fbf71;
    --blue:#4c9aff;--blue-ink:#4c9aff;
    --purple:#a78bfa;--purple-ink:#a78bfa;
    --amber:#f5a524;--amber-ink:#f5a524;
    --warn:#f5a524;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:0 auto;padding:0 0 5rem;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:calc(.7rem + env(safe-area-inset-top,0px)) .9rem .3rem}
h1{font-size:1.25rem;font-weight:700;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent-ink)}
.status{font-size:.8rem;color:var(--muted);text-align:right}
.stale{color:var(--warn);font-weight:600}
.stale::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:currentColor;margin-right:.35em}
#stick{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);padding:0 .6rem .5rem}
.tabs{display:flex;gap:.2rem}
.tab{flex:1;min-height:44px;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);font:inherit;font-weight:600;padding:.4rem .3rem;cursor:pointer}
.tab.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;padding:.3rem .8rem;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.9rem;font-weight:500;cursor:pointer}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent-fill);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.active{border-color:var(--accent);color:var(--accent-ink)}
select,input[type=date]{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;min-height:44px}
#bar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.5rem;padding:.5rem;background:var(--card);border:1px solid var(--line);border-radius:12px}
#bar label{display:flex;gap:.4rem;align-items:center;font-size:.85rem;color:var(--muted)}
#count{font-weight:600;margin-right:.3rem}
ul{list-style:none;margin:0;padding:0}
#list{padding:.6rem .6rem 0}
.row{display:flex;gap:.6rem;align-items:center;padding:.5rem;margin:0 0 .5rem;background:var(--card);border:1px solid var(--line);border-radius:12px;transition:opacity .16s,transform .16s}
.row.prog{background:color-mix(in srgb,var(--green) 9%,var(--card));border-color:color-mix(in srgb,var(--green) 35%,var(--line));box-shadow:inset 3px 0 0 var(--green)}
.row.sel{background:color-mix(in srgb,var(--accent) 16%,var(--card));border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row.leaving{opacity:0;transform:translateX(12px)}
.row .main{display:flex;gap:.6rem;flex:1;min-width:0;color:inherit;text-decoration:none;align-items:center}
.row img{width:108px;aspect-ratio:16/9;object-fit:cover;background:var(--chip);border-radius:8px;flex:none}
.txt{min-width:0}
.title{display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.chan{color:var(--muted);font-size:.88rem;margin-top:.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.age{color:var(--muted);font-size:.8rem;margin-top:.1rem}
.badge{display:inline-block;margin-left:.4rem;padding:.02rem .5rem;border-radius:999px;font-size:.68rem;font-weight:700;letter-spacing:.03em;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.b-prog{--c:var(--green);--ink:var(--green-ink)}
.b-later{--c:var(--blue);--ink:var(--blue-ink)}
.b-short{--c:var(--purple);--ink:var(--purple-ink)}
.b-vod{--c:var(--amber);--ink:var(--amber-ink)}
.wbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-width:64px;min-height:48px;padding:.25rem .4rem;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:.7rem;font-weight:600;cursor:pointer;flex:none}
.wbtn svg{width:20px;height:20px;color:var(--green-ink)}
.row input[type=checkbox]{width:1.5rem;height:1.5rem;flex:none;accent-color:var(--accent)}
#empty{padding:2rem;text-align:center;color:var(--muted)}
#note{margin:.4rem .9rem 0;font-size:.85rem;color:var(--warn)}
.card{margin:.6rem;padding:.8rem;background:var(--card);border:1px solid var(--line);border-radius:12px}
.card h2{font-size:1rem;margin:0 0 .5rem}
.card p{margin:.4rem 0;font-size:.85rem;color:var(--muted)}
.card label{display:flex;gap:.5rem;align-items:center;margin:.4rem 0}
.card input[type=checkbox]{accent-color:var(--accent);width:1.2rem;height:1.2rem}
.txtin{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem;min-height:44px}
textarea.txtin{resize:vertical}
code{background:var(--chip);padding:0 .25rem;border-radius:.2rem}
#addbar{display:flex;gap:.4rem;align-items:flex-start}
#chadd{display:flex;gap:.4rem;flex-wrap:wrap}
#chinfo{font-size:.85rem;color:var(--muted);margin:.4rem 0}
#pendlist li{font-size:.85rem;color:var(--muted)}
#chfilter{width:100%;margin-top:.4rem}
.chrow{padding:.7rem;margin:0 0 .5rem;background:var(--card);border:1px solid var(--line);border-radius:12px}
.chname{font-weight:600;margin-bottom:.4rem;overflow-wrap:anywhere}
.chctl{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center}
.chctl label{display:flex;gap:.3rem;align-items:center;font-size:.85rem;color:var(--muted)}
.chctl select{min-height:40px}
.chctl input[type=checkbox]{width:1.2rem;height:1.2rem;accent-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:.4rem .5rem .4rem 1rem;border-radius:10px;display:flex;align-items:center;gap:.8rem;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#toast button{background:transparent;color:var(--bg);border:1px solid var(--bg);border-radius:8px;min-height:36px;padding:.2rem .8rem;font:inherit;cursor:pointer}
@media (min-width:700px){.row img{width:168px}.title{-webkit-line-clamp:2;line-clamp:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <h1>Queue<span>Tube</span></h1>
  <div class="status"><span id="sync"></span><span id="updated"></span></div>
</div>
<div id="stick">
  <nav class="tabs">
    <button id="tab-queue" class="tab on"><span class="lbl">Queue</span></button>
    <button id="tab-later" class="tab"><span class="lbl">Later</span></button>
    <button id="tab-watched" class="tab"><span class="lbl">Watched</span></button>
    <button id="tab-channels" class="tab"><span class="lbl">Channels</span></button>
  </nav>
  <div class="tools">
    <button class="btn" id="sort" data-ico="sort"><span class="lbl"></span></button>
    <button class="btn" id="select" data-ico="select"><span class="lbl">Select</span></button>
    <button class="btn" id="refresh" data-ico="refresh"><span class="lbl">Refresh</span></button>
    <button class="btn" id="settingsbtn" data-ico="settings"><span class="lbl">Settings</span></button>
  </div>
  <div id="bar" hidden>
    <span id="count">0 selected</span>
    <button class="btn primary" id="markbtn" data-ico="check"><span class="lbl">Mark watched</span></button>
    <button class="btn" id="selonly" data-ico="filter"><span class="lbl">Selected only</span></button>
    <button class="btn" id="selall" data-ico="boxcheck"><span class="lbl">Select all</span></button>
    <select id="chsel" aria-label="Select a channel"></select>
    <label>Older than <input type="date" id="olderdate"></label>
  </div>
</div>
<section id="settings" class="card" hidden>
  <h2>Settings</h2>
  <label><input type="checkbox" id="tapmarks"> Tapping a video moves it to the front of the queue</label>
  <label>Show Watch Later in the Queue at tier <select id="latertier"></select></label>
  <p>Sync target: <code id="slug"></code>, branch <code>state</code>. Needs a fine-grained token with Contents read and write on this repo only.</p>
  <label>Token <input class="txtin" type="password" id="tok" autocomplete="off" placeholder="paste token"></label>
  <div>
    <button class="btn" id="tokSave">Save and test</button>
    <button class="btn" id="tokClear">Remove token</button>
  </div>
  <p id="settingsMsg"></p>
</section>
<section id="chpanel" class="card" hidden>
  <div id="chadd">
    <input class="txtin" id="chin" type="text" placeholder="@handle, channel link, or UC id" autocomplete="off">
    <select id="chtier" aria-label="Tier for new channel"></select>
    <button class="btn" id="chaddbtn">Add channel</button>
  </div>
  <div id="chinfo"></div>
  <ul id="pendlist"></ul>
  <input class="txtin" id="chfilter" type="text" placeholder="Filter channels" autocomplete="off">
</section>
<main>
  <div id="addbar" class="card" hidden>
    <textarea class="txtin" id="addin" rows="2" placeholder="Paste one or more YouTube links"></textarea>
    <button class="btn" id="addbtn">Add</button>
  </div>
  <p id="note" hidden></p>
  <ul id="list"></ul>
  <p id="empty" hidden></p>
</main>
<div id="toast" hidden></div>
<script>
"use strict";
const DATA_BASE = "data/";
const STALE_HOURS = 6;
const API = "https://api.github.com";
const STATE_BRANCH = "state";
const STATE_PATH = "watched.json";
const OWNER = location.hostname.split(".")[0];
const REPO = location.pathname.split("/")[1] || "";
const REPO_API = API + "/repos/" + OWNER + "/" + REPO + "/contents/";
const FILE_URL = REPO_API + STATE_PATH;
const CH_URL = REPO_API + "data/channels.json";
const $ = (s) => document.querySelector(s);
const NEW_TAB = window.matchMedia("(pointer: fine)").matches;
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};

/* ---------- icons ---------- */

const ICONS = {
  check: [["path", "M5 12.5l4.5 4.5L19 7.5"]],
  undo: [["path", "M9 14L4 9l5-5"], ["path", "M4 9h10a6 6 0 0 1 0 12h-3"]],
  sort: [["path", "M7 4v16"], ["path", "M4 17l3 3 3-3"], ["path", "M17 20V4"], ["path", "M14 7l3-3 3 3"]],
  select: [["path", "M9 6h11M9 12h11M9 18h11"], ["path", "M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"]],
  refresh: [["path", "M20 12a8 8 0 1 1-2.6-5.9"], ["path", "M20 4v5h-5"]],
  settings: [["path", "M4 7h9M17 7h3M4 17h3M11 17h9"], ["circle", 15, 7, 2], ["circle", 9, 17, 2]],
  filter: [["path", "M4 5h16l-6 7v6l-4 2v-8z"]],
  boxcheck: [["path", "M4 5h16v14H4z"], ["path", "M8 12.5l3 3 5-6"]]
};

function ico(name) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  (ICONS[name] || []).forEach((s) => {
    if (s[0] === "path") {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", s[1]);
      svg.append(p);
    } else {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", s[1]);
      c.setAttribute("cy", s[2]);
      c.setAttribute("r", s[3]);
      svg.append(c);
    }
  });
  return svg;
}

document.querySelectorAll("[data-ico]").forEach((b) => b.prepend(ico(b.dataset.ico)));

/* ---------- state ---------- */

function loadState() {
  let s = store.get("qt.state", null);
  if (s) return s;
  s = {};
  const old = store.get("qt.watched", {});
  for (const id in old) s[id] = { t: old[id], w: 1 };
  store.set("qt.state", s);
  return s;
}

let state = loadState();
let later = store.get("qt.later", {});
let prefs = store.get("qt.prefs", { laterTier: 0, t: 0 });
let token = store.get("qt.token", "");
let tapStarts = store.get("qt.tapStarts", true);
let newestFirst = store.get("qt.newestFirst", false);
let view = "queue", selectMode = false, selected = new Set(), selOnly = false;
let queue = null, chans = new Map(), toastTimer;
let remoteSha = null, rev = 0, lastPull = 0, pushTimer = null, busy = false;
let metaFailed = false;
const metaTried = new Set();
let chPatch = store.get("qt.chPatch", {});
let chAdd = store.get("qt.chAdd", []);
let pendingList = [], chOrder = [];
let chRev = 0, chBusy = false, chTimer = null, chMsg = "", chBad = false;

const isWatched = (id) => !!(state[id] && state[id].w);
const startedAt = (id) => (state[id] && !state[id].w && state[id].s) || 0;
const dateOf = (v) => Date.parse(v.published || v.added);
const hasChPending = () => Object.keys(chPatch).length > 0 || chAdd.length > 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function setStatus(s, msg) {
  const names = { local: "Local only", idle: "", pending: "Unsaved", saving: "Saving…",
                  syncing: "Syncing…", synced: "Synced", error: "Sync error" };
  const text = (names[s] || s) + (msg ? ": " + msg : "");
  const e = $("#sync");
  e.textContent = text ? text + " · " : "";
  e.className = s === "error" ? "stale" : "";
}

/* ---------- sync ---------- */

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function b64dec(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}

function mergeMap(local, remote) {
  let changed = false;
  for (const id in remote) {
    const r = remote[id], l = local[id];
    if (!l || r.t > l.t) { local[id] = r; changed = true; }
  }
  return changed;
}

function gh(method, url, body) {
  const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  if (body) headers["Content-Type"] = "application/json";
  return fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
}

async function pullRemote() {
  const r = await gh("GET", FILE_URL + "?ref=" + STATE_BRANCH);
  if (r.status === 404) {
    const j = await r.json().catch(() => ({}));
    if (/ref/i.test(j.message || "")) throw new Error("branch " + STATE_BRANCH + " not found");
    remoteSha = null;
    return;
  }
  if (r.status === 401) throw new Error("token rejected");
  if (!r.ok) throw new Error("GitHub " + r.status);
  const j = await r.json();
  remoteSha = j.sha;
  const data = JSON.parse(b64dec(j.content));
  if (mergeMap(state, data.items || {})) store.set("qt.state", state);
  if (mergeMap(later, data.later || {})) store.set("qt.later", later);
  if (data.prefs && data.prefs.t > (prefs.t || 0)) {
    prefs = data.prefs;
    store.set("qt.prefs", prefs);
  }
}

async function pushRemote() {
  for (let i = 0; i < 3; i++) {
    await pullRemote();
    const body = {
      message: "watched state",
      content: b64enc(JSON.stringify({ v: 3, items: state, later: later, prefs: prefs })),
      branch: STATE_BRANCH
    };
    if (remoteSha) body.sha = remoteSha;
    const r = await gh("PUT", FILE_URL, body);
    if (r.ok) { remoteSha = (await r.json()).content.sha; return; }
    if (r.status !== 409 && r.status !== 422) throw new Error("GitHub " + r.status);
  }
  throw new Error("conflict, will retry");
}

async function flush() {
  if (!token || !store.get("qt.dirty", false)) return;
  if (busy) { schedule(); return; }
  busy = true;
  const start = rev;
  setStatus("saving");
  try {
    await pushRemote();
    if (rev === start) store.set("qt.dirty", false);
    lastPull = Date.now();
    setStatus("synced");
    render();
  } catch (e) {
    setStatus("error", e.message);
  }
  busy = false;
  if (rev !== start && store.get("qt.dirty", false)) schedule();
}

function schedule() {
  if (!token) return;
  setStatus("pending");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(flush, 2000);
}

async function sync(force) {
  if (!token || busy) return;
  if (store.get("qt.dirty", false)) { await flush(); return; }
  if (!force && Date.now() - lastPull < 15000) return;
  busy = true;
  setStatus("syncing");
  try {
    await pullRemote();
    lastPull = Date.now();
    setStatus("synced");
    render();
  } catch (e) {
    setStatus("error", e.message);
  }
  busy = false;
}

function markDirty() {
  rev++;
  store.set("qt.dirty", true);
  schedule();
}

function setW(ids, w) {
  const now = Date.now();
  ids.forEach((id) => { state[id] = { t: now, w: w }; });
  store.set("qt.state", state);
  markDirty();
}

function setStarted(id) {
  const now = Date.now();
  state[id] = { t: now, w: 0, s: now };
  store.set("qt.state", state);
  markDirty();
}

function setPref(n) {
  prefs = { laterTier: n, t: Date.now() };
  store.set("qt.prefs", prefs);
  markDirty();
  render();
}

/* ---------- watch later ---------- */

function extractId(text) {
  const t = String(text || "").trim();
  if (/^[\w-]{11}$/.test(t)) return t;
  let u;
  try { u = new URL(t); } catch (e) { return null; }
  const h = u.hostname.replace(/^(www|m|music)\./, "");
  let id = null;
  if (h === "youtu.be") {
    id = u.pathname.slice(1).split("/")[0];
  } else if (h === "youtube.com" || h === "youtube-nocookie.com") {
    if (u.pathname === "/watch") {
      id = u.searchParams.get("v");
    } else {
      const m = u.pathname.match(/^\/(?:shorts|live|embed|v)\/([\w-]{11})/);
      if (m) id = m[1];
    }
  }
  return id && /^[\w-]{11}$/.test(id) ? id : null;
}

function addLater(text) {
  const id = extractId(text);
  if (!id) { toast("Not a YouTube video link"); return false; }
  const exists = !!later[id];
  if (exists && !isWatched(id)) { toast("Already in Watch Later"); return false; }
  const now = Date.now();
  let title = exists ? later[id].title : null;
  let channel = exists ? later[id].channel : null;
  const qv = queue && queue.videos.find((v) => v.id === id);
  if (qv && !title) {
    title = qv.title;
    const ch = chans.get(qv.channel_id);
    channel = ch ? ch.name : channel;
  }
  later[id] = { added: now, title: title, channel: channel, t: now };
  store.set("qt.later", later);
  if (isWatched(id)) setW([id], 0); else markDirty();
  render();
  toast("Added to Watch Later");
  fillMeta();
  return true;
}

function addLaterMany(text) {
  const tokens = String(text || "").split(/\s+/).filter(Boolean);
  const entries = [];
  tokens.forEach((tk) => {
    if (/^\d{4}-\d{2}-\d{2}/.test(tk) && entries.length) {
      const ts = Date.parse(tk);
      if (!Number.isNaN(ts)) entries[entries.length - 1].ts = ts;
      return;
    }
    entries.push({ id: extractId(tk), ts: null });
  });
  if (entries.length < 2 && !(entries[0] && entries[0].ts !== null)) return addLater(text);
  const base = Date.now();
  let added = 0, updated = 0, skipped = 0;
  entries.forEach((p, i) => {
    const id = p.id;
    if (!id) { skipped++; return; }
    const prev = later[id];
    const t = base + i;
    if (prev && p.ts !== null) {
      if (prev.added !== p.ts) { prev.added = p.ts; prev.t = t; updated++; } else { skipped++; }
      return;
    }
    if (prev && !isWatched(id)) { skipped++; return; }
    const qv = queue && queue.videos.find((v) => v.id === id);
    const ch = qv ? chans.get(qv.channel_id) : null;
    later[id] = {
      added: p.ts !== null ? p.ts : t,
      title: prev ? prev.title : (qv ? qv.title : null),
      channel: prev ? prev.channel : (ch ? ch.name : null),
      t: t
    };
    if (isWatched(id)) state[id] = { t: t, w: 0 };
    added++;
  });
  store.set("qt.later", later);
  store.set("qt.state", state);
  if (added || updated) markDirty();
  render();
  toast(added + " added" + (updated ? ", " + updated + " dates updated" : "") +
    (skipped ? ", " + skipped + " skipped" : ""));
  fillMeta();
  return added > 0 || updated > 0;
}

async function fetchMeta(id) {
  const url = "https://www.youtube.com/oembed?format=json&url=" +
    encodeURIComponent("https://www.youtube.com/watch?v=" + id);
  const r = await fetch(url);
  if (!r.ok) throw new Error("oembed " + r.status);
  const j = await r.json();
  return { title: j.title, channel: j.author_name };
}

async function fillMeta() {
  for (const id of Object.keys(later)) {
    const it = later[id];
    if (it.title || metaTried.has(id)) continue;
    metaTried.add(id);
    try {
      const m = await fetchMeta(id);
      it.title = m.title;
      it.channel = m.channel;
      it.t = Date.now();
      store.set("qt.later", later);
      markDirty();
    } catch (e) {
      metaFailed = true;
    }
    render();
  }
}

function laterEntry(id) {
  const it = later[id];
  return { id: id, kind: "later", title: it.title || "youtube.com/watch?v=" + id,
           channelName: it.channel || "", added: new Date(it.added).toISOString() };
}

function laterItems() {
  return Object.keys(later).filter((id) => !isWatched(id)).map(laterEntry).sort((a, b) => {
    const sa = startedAt(a.id), sb = startedAt(b.id);
    if (sa || sb) return !sa ? 1 : !sb ? -1 : sb - sa;
    const d = Date.parse(a.added) - Date.parse(b.added);
    return newestFirst ? -d : d;
  });
}

/* ---------- channels ---------- */

async function loadChannels() {
  if (token) {
    try {
      const r = await gh("GET", CH_URL + "?t=" + Date.now());
      if (r.ok) return JSON.parse(b64dec((await r.json()).content));
    } catch (e) { /* fall back to Pages */ }
  }
  const r = await fetch(DATA_BASE + "channels.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("channels.json " + r.status);
  return r.json();
}

function sortChannels() {
  chOrder = [...chans.values()].sort((a, b) =>
    ((a.tier ?? 99) - (b.tier ?? 99)) || (a.name || "").localeCompare(b.name || "")).map((c) => c.id);
}

function channelItems() {
  const f = $("#chfilter").value.trim().toLowerCase();
  return chOrder.map((id) => chans.get(id))
    .filter((ch) => ch && (!f || (ch.name || ch.id).toLowerCase().includes(f)));
}

function setChMsg(text, bad) {
  chMsg = text;
  chBad = !!bad;
  if (view === "channels") renderChPanel();
}

function scheduleCh() {
  if (!token) return;
  setChMsg("Unsaved");
  clearTimeout(chTimer);
  chTimer = setTimeout(saveChannels, 4000);
}

function applyPatch(cfg, patch, adds) {
  for (const ch of cfg.channels) {
    const p = patch[ch.id];
    if (p) Object.assign(ch, p);
  }
  cfg.pending = cfg.pending || [];
  adds.forEach((a) => {
    const key = a.input.toLowerCase();
    const known = cfg.channels.some((c) => c.id === a.input) ||
      cfg.pending.some((p) => p.input.toLowerCase() === key);
    if (!known) cfg.pending.push({ input: a.input, tier: a.tier });
  });
}

async function saveChannels() {
  if (!token || !hasChPending()) return;
  if (chBusy) { scheduleCh(); return; }
  chBusy = true;
  const start = chRev;
  const patch = JSON.parse(JSON.stringify(chPatch));
  const adds = chAdd.slice();
  setChMsg("Saving…");
  try {
    let saved = null;
    for (let i = 0; i < 3 && !saved; i++) {
      const r = await gh("GET", CH_URL + "?t=" + Date.now());
      if (r.status === 401) throw new Error("token rejected");
      if (!r.ok) throw new Error("GitHub " + r.status);
      const j = await r.json();
      const cfg = JSON.parse(b64dec(j.content));
      applyPatch(cfg, patch, adds);
      const put = await gh("PUT", CH_URL, {
        message: "channel settings",
        content: b64enc(JSON.stringify(cfg, null, 1) + "\n"),
        sha: j.sha
      });
      if (put.ok) saved = cfg;
      else if (put.status !== 409 && put.status !== 422) throw new Error("GitHub " + put.status);
    }
    if (!saved) throw new Error("conflict, will retry");
    pendingList = saved.pending || [];
    if (chRev === start) {
      chPatch = {};
      chAdd = [];
      store.set("qt.chPatch", chPatch);
      store.set("qt.chAdd", chAdd);
      setChMsg("Saved");
    } else {
      scheduleCh();
    }
  } catch (e) {
    setChMsg("Save failed: " + e.message, true);
  }
  chBusy = false;
  render();
}

function setCh(id, key, val) {
  const ch = chans.get(id);
  if (!ch) return;
  ch[key] = val;
  (chPatch[id] = chPatch[id] || {})[key] = val;
  store.set("qt.chPatch", chPatch);
  chRev++;
  scheduleCh();
  updateCounts();
}

function parseChannelInput(text) {
  const t = String(text || "").trim();
  if (!t) return null;
  if (/^UC[\w-]{22}$/.test(t)) return t;
  let m = t.match(/youtube\.com\/channel\/(UC[\w-]{22})/i);
  if (m) return m[1];
  m = t.match(/youtube\.com\/(@[\w.%-]+)/i);
  if (m) return decodeURIComponent(m[1]);
  if (/^@?[\w.%-]+$/.test(t)) return t.startsWith("@") ? t : "@" + t;
  return null;
}

function addChannel() {
  if (!token) { toast("Add a token in Settings first"); return; }
  const input = parseChannelInput($("#chin").value);
  if (!input) { toast("Enter a @handle, channel link, or UC id"); return; }
  const tier = Number($("#chtier").value);
  store.set("qt.addTier", tier);
  const key = input.toLowerCase();
  const known = chans.has(input) ||
    pendingList.some((p) => p.input.toLowerCase() === key) ||
    chAdd.some((p) => p.input.toLowerCase() === key);
  if (known) { toast("Already added"); return; }
  chAdd.push({ input: input, tier: tier });
  store.set("qt.chAdd", chAdd);
  $("#chin").value = "";
  chRev++;
  scheduleCh();
  render();
}

const TIERS = Array.from({ length: 10 }, (_, i) => [String(i + 1), String(i + 1)]);
const HIDE_BADGE = [["hide", "Hide"], ["badge", "Badge"]];

function field(label, opts, value, onchange) {
  const lab = el("label", null, label);
  const s = el("select");
  opts.forEach(([v, t]) => s.append(new Option(t, v)));
  s.value = String(value);
  s.disabled = !token;
  s.onchange = () => onchange(s.value);
  lab.append(s);
  return lab;
}

function chRow(ch) {
  const li = el("li", "chrow");
  li.append(el("div", "chname", ch.name || ch.id));
  const ctl = el("div", "chctl");
  ctl.append(
    field("Tier", TIERS, ch.tier ?? 9, (v) => setCh(ch.id, "tier", Number(v))),
    field("Shorts", HIDE_BADGE, ch.shorts || "hide", (v) => setCh(ch.id, "shorts", v)),
    field("Live VODs", HIDE_BADGE, ch.live || "hide", (v) => setCh(ch.id, "live", v))
  );
  const lab = el("label", null, "Muted");
  const cb = el("input");
  cb.type = "checkbox";
  cb.checked = !!ch.muted;
  cb.disabled = !token;
  cb.onchange = () => setCh(ch.id, "muted", cb.checked);
  lab.prepend(cb);
  ctl.append(lab);
  li.append(ctl);
  return li;
}

function renderChPanel() {
  const info = $("#chinfo");
  info.textContent = token ? chMsg : "Add a token in Settings to edit channels.";
  info.className = chBad ? "stale" : "";
  ["#chin", "#chtier", "#chaddbtn"].forEach((s) => { $(s).disabled = !token; });
  const seen = new Set();
  const pend = pendingList.concat(chAdd).filter((p) => {
    const k = p.input.toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  $("#pendlist").replaceChildren(...pend.map((p) =>
    el("li", null, "Pending: " + p.input + " (tier " + p.tier + ")")));
}

/* ---------- data ---------- */

async function load() {
  const [q, c] = await Promise.all([
    fetch(DATA_BASE + "queue.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error("queue.json " + r.status); return r.json(); }),
    loadChannels()
  ]);
  queue = q;
  chans = new Map(c.channels.map((ch) => [ch.id, ch]));
  pendingList = c.pending || [];
  for (const id in chPatch) {
    const ch = chans.get(id);
    if (ch) Object.assign(ch, chPatch[id]);
  }
  sortChannels();
}

function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

const tierOf = (v) => (v.kind === "later" ? (prefs.laterTier || 99) : (chans.get(v.channel_id).tier ?? 99));
const chanOf = (v) => (v.kind === "later" ? "__later" : v.channel_id);

function visible() {
  const out = queue.videos.filter((v) => {
    if (v.state !== "ready" || isWatched(v.id)) return false;
    const ch = chans.get(v.channel_id);
    if (!ch || ch.muted) return false;
    if (v.kind === "short" && ch.shorts !== "badge") return false;
    if (v.kind === "vod" && ch.live !== "badge") return false;
    return true;
  });
  if (prefs.laterTier) {
    const have = new Set(out.map((v) => v.id));
    laterItems().forEach((it) => { if (!have.has(it.id)) out.push(it); });
  }
  return out.sort((a, b) => {
    const sa = startedAt(a.id), sb = startedAt(b.id);
    if (sa || sb) return !sa ? 1 : !sb ? -1 : sb - sa;
    const ta = tierOf(a), tb = tierOf(b);
    if (ta !== tb) return ta - tb;
    const d = dateOf(a) - dateOf(b);
    return newestFirst ? -d : d;
  });
}

function watchedItems() {
  const out = [], seen = new Set();
  queue.videos.forEach((v) => { if (isWatched(v.id)) { out.push(v); seen.add(v.id); } });
  Object.keys(later).forEach((id) => { if (isWatched(id) && !seen.has(id)) out.push(laterEntry(id)); });
  return out.sort((a, b) => state[b.id].t - state[a.id].t);
}

function currentItems() {
  if (view === "queue") return visible();
  if (view === "later") return laterItems();
  return watchedItems();
}

/* ---------- ui ---------- */

function toast(msg, undo) {
  const t = $("#toast");
  t.replaceChildren(el("span", null, msg));
  if (undo) {
    const b = el("button", null, "Undo");
    b.onclick = () => { undo(); t.hidden = true; };
    t.append(b);
  }
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}

function markWatched(ids) {
  const before = ids.map((id) => (state[id] ? Object.assign({}, state[id]) : null));
  setW(ids, 1);
  render();
  toast(ids.length + (ids.length === 1 ? " video" : " videos") + " marked watched", () => {
    const now = Date.now();
    ids.forEach((id, i) => { state[id] = Object.assign({}, before[i] || {}, { t: now, w: 0 }); });
    store.set("qt.state", state);
    markDirty();
    render();
  });
}

function unwatch(id) {
  setW([id], 0);
  render();
}

function toggle(id, cb, on) {
  if (on) selected.add(id); else selected.delete(id);
  cb.checked = on;
  const li = cb.closest("li");
  if (li) li.classList.toggle("sel", on);
  $("#count").textContent = selected.size + " selected";
  if (selOnly) render();
}

function row(v) {
  const ch = chans.get(v.channel_id);
  const li = el("li", "row" + (startedAt(v.id) ? " prog" : "") +
    (selectMode && selected.has(v.id) ? " sel" : ""));
  let cb = null;
  if (selectMode && (view === "queue" || view === "later")) {
    cb = el("input");
    cb.type = "checkbox";
    cb.checked = selected.has(v.id);
    cb.onchange = () => toggle(v.id, cb, cb.checked);
    li.append(cb);
  }
  const a = el("a", "main");
  a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.id);
  a.rel = "noopener noreferrer";
  if (NEW_TAB) a.target = "_blank";
  a.onclick = (e) => {
    if (cb) { e.preventDefault(); toggle(v.id, cb, !cb.checked); return; }
    if (view !== "watched" && tapStarts) {
      setStarted(v.id);
      setTimeout(render, 150);
    }
  };
  const img = el("img");
  img.src = "https://i.ytimg.com/vi/" + encodeURIComponent(v.id) + "/mqdefault.jpg";
  img.alt = "";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  const text = el("div", "txt");
  text.append(el("div", "title", v.title));
  const chanName = v.kind === "later" ? (v.channelName || "") : (ch ? ch.name : "");
  const ageText = v.kind === "later" ? "added " + ago(v.added) : ago(v.published);
  if (chanName) text.append(el("div", "chan", chanName));
  const age = el("div", "age", ageText);
  const badge = (cls, label) => age.append(el("span", "badge " + cls, label));
  if (v.kind === "short") badge("b-short", "SHORT");
  if (v.kind === "vod") badge("b-vod", "VOD");
  if (v.kind === "later" && view === "queue") badge("b-later", "LATER");
  if (startedAt(v.id)) badge("b-prog", "IN PROGRESS");
  text.append(age);
  a.append(img, text);
  li.append(a);
  if (!cb) {
    const inWatched = view === "watched";
    const b = el("button", "wbtn");
    b.append(ico(inWatched ? "undo" : "check"), el("span", null, inWatched ? "Unwatch" : "Watched"));
    b.onclick = () => {
      if (inWatched) { unwatch(v.id); return; }
      if (REDUCED) { markWatched([v.id]); return; }
      li.classList.add("leaving");
      setTimeout(() => markWatched([v.id]), 160);
    };
    li.append(b);
  }
  return li;
}

function buildBar(items) {
  const bar = $("#bar");
  bar.hidden = !(selectMode && (view === "queue" || view === "later"));
  if (bar.hidden) return;
  $("#count").textContent = selected.size + " selected";
  const sel = $("#chsel");
  sel.hidden = view !== "queue";
  if (view !== "queue") return;
  const names = new Map();
  items.forEach((v) => names.set(chanOf(v),
    v.kind === "later" ? "Watch Later" : (chans.get(v.channel_id).name || v.channel_id)));
  sel.replaceChildren(new Option("Select channel…", ""));
  [...names].sort((a, b) => a[1].localeCompare(b[1])).forEach(([id, n]) => sel.append(new Option(n, id)));
}

function updateCounts() {
  if (!queue) return;
  $("#tab-queue .lbl").textContent = "Queue (" + visible().length + ")";
  $("#tab-later .lbl").textContent = "Later (" + laterItems().length + ")";
}

function render() {
  if (!queue) return;
  updateCounts();
  ["queue", "later", "watched", "channels"].forEach((v) =>
    $("#tab-" + v).classList.toggle("on", view === v));
  $("#sort .lbl").textContent = newestFirst ? "Newest first" : "Oldest first";
  $("#sort").hidden = view === "channels";
  $("#select .lbl").textContent = selectMode ? "Cancel" : "Select";
  $("#select").classList.toggle("active", selectMode);
  $("#select").hidden = view === "watched" || view === "channels";
  $("#addbar").hidden = view !== "later";
  $("#chpanel").hidden = view !== "channels";
  let items, mapper = row;
  if (view === "queue") items = visible();
  else if (view === "later") items = laterItems();
  else if (view === "watched") items = watchedItems();
  else { items = channelItems(); mapper = chRow; renderChPanel(); }
  const note = $("#note");
  note.hidden = !(view === "later" && metaFailed && items.some((v) => !later[v.id].title));
  note.textContent = "Titles could not be fetched (the browser blocked the lookup).";
  const mins = Math.round((Date.now() - Date.parse(queue.generated_at)) / 60000);
  const u = $("#updated");
  u.textContent = "Updated " + (mins < 60 ? mins + " min" : Math.round(mins / 60) + " h") + " ago";
  u.className = mins > STALE_HOURS * 60 ? "stale" : "";
  buildBar(items);
  if (!selectMode || !selected.size) selOnly = false;
  if (selOnly && (view === "queue" || view === "later")) {
    items = items.filter((v) => selected.has(v.id));
  }
  $("#selonly .lbl").textContent = selOnly ? "Show all" : "Selected only";
  $("#selonly").classList.toggle("active", selOnly);
  $("#latertier").value = String(prefs.laterTier);
  $("#list").replaceChildren(...items.map(mapper));
  const empty = $("#empty");
  empty.hidden = items.length > 0;
  empty.textContent = view === "queue" ? "Nothing to watch."
    : view === "later" ? "Watch Later is empty."
    : view === "channels" ? "No matching channels." : "Nothing watched yet.";
}

function selectWhere(fn) {
  currentItems().filter(fn).forEach((v) => selected.add(v.id));
  render();
}

function setView(v) {
  view = v;
  selectMode = false;
  selected.clear();
  if (v === "channels") sortChannels();
  render();
}

/* ---------- events ---------- */

$("#tab-queue").onclick = () => setView("queue");
$("#tab-later").onclick = () => setView("later");
$("#tab-watched").onclick = () => setView("watched");
$("#tab-channels").onclick = () => setView("channels");
$("#sort").onclick = () => { newestFirst = !newestFirst; store.set("qt.newestFirst", newestFirst); render(); };
$("#select").onclick = () => { selectMode = !selectMode; selected.clear(); render(); };
$("#selall").onclick = () => selectWhere(() => true);
$("#selonly").onclick = () => { selOnly = !selOnly; render(); };
$("#chsel").onchange = (e) => {
  if (!e.target.value) return;
  selOnly = true;
  selectWhere((v) => chanOf(v) === e.target.value);
};
$("#olderdate").onchange = (e) => {
  if (!e.target.value) return;
  const cutoff = new Date(e.target.value + "T00:00:00").getTime();
  selOnly = true;
  selectWhere((v) => dateOf(v) < cutoff);
  e.target.value = "";
};
$("#markbtn").onclick = () => {
  const n = selected.size;
  if (!n) return;
  if (n >= 10 && !confirm("Mark " + n + " videos as watched?")) return;
  const ids = [...selected];
  selected.clear();
  selectMode = false;
  markWatched(ids);
};
$("#refresh").onclick = async () => {
  try { await load(); render(); await sync(true); } catch (e) { toast("Refresh failed: " + e.message); }
};

$("#addbtn").onclick = () => { if (addLaterMany($("#addin").value)) $("#addin").value = ""; };
$("#addin").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("#addbtn").click();
});

$("#chaddbtn").onclick = addChannel;
$("#chin").addEventListener("keydown", (e) => { if (e.key === "Enter") addChannel(); });
$("#chfilter").oninput = render;
TIERS.forEach(([v, t]) => $("#chtier").append(new Option(t, v)));
$("#chtier").value = String(store.get("qt.addTier", 9));

$("#settingsbtn").onclick = () => { $("#settings").hidden = !$("#settings").hidden; };
$("#settingsbtn").classList.toggle("active", false);
$("#tapmarks").checked = tapStarts;
$("#tapmarks").onchange = (e) => { tapStarts = e.target.checked; store.set("qt.tapStarts", tapStarts); };
[["0", "Off (Later tab only)"], ...TIERS].forEach(([v, t]) => $("#latertier").append(new Option(t, v)));
$("#latertier").value = String(prefs.laterTier);
$("#latertier").onchange = (e) => setPref(Number(e.target.value));
$("#slug").textContent = OWNER + "/" + REPO;
$("#tokSave").onclick = async () => {
  const v = $("#tok").value.trim();
  const msg = $("#settingsMsg");
  if (!v) return;
  const previous = token;
  token = v;
  msg.textContent = "Testing…";
  try {
    await pullRemote();
    store.set("qt.token", token);
    rev++;
    store.set("qt.dirty", true);
    $("#tok").value = "";
    await flush();
    msg.textContent = store.get("qt.dirty", false) ? "Token saved, but the first sync failed." : "Connected and synced.";
    try { await load(); } catch (e) { /* keep current data */ }
    if (hasChPending()) scheduleCh();
    render();
  } catch (e) {
    token = previous;
    msg.textContent = "Failed: " + e.message;
  }
};
$("#tokClear").onclick = () => {
  token = "";
  store.set("qt.token", "");
  setStatus("local");
  $("#settingsMsg").textContent = "Token removed. Watched state stays on this device only.";
  render();
};

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") sync(false);
  else { flush(); saveChannels(); }
});

/* ---------- startup ---------- */

setStatus(token ? "idle" : "local");
const startAdd = new URLSearchParams(location.search).get("add");
if (startAdd) {
  history.replaceState(null, "", location.pathname + location.hash);
  view = "later";
}
(async () => {
  try {
    await load();
    render();
  } catch (e) {
    $("#empty").hidden = false;
    $("#empty").textContent = "Could not load data: " + e.message;
  }
  await sync(true);
  if (startAdd) addLater(startAdd);
  fillMeta();
  if (hasChPending()) scheduleCh();
})();
</script>
</body>
</html>
