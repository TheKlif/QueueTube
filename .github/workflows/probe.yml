name: probe
on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Space-separated UC IDs or @handles"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe
        env:
          CHANNELS: ${{ inputs.channels }}
        run: python scripts/probe.py $CHANNELS