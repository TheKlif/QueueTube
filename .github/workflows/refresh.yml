name: refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      prune_days:
        description: "One-time: drop queue videos older than this many days"
        required: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        env:
          PRUNE_DAYS: ${{ inputs.prune_days }}
        run: python scripts/fetch_feeds.py
      - name: Commit changes
        run: |
          git config user.name "queuetube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "refresh" && git pull --rebase && git push)